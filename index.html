<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QR Video Transfer</title>
<style>
*{box-sizing:border-box}
.tab{display:none}.tab.active{display:block}
.hidden{display:none!important}
.tabs,.row,.checkbox{display:flex;gap:5px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formgrid,.stats,.preview-wrap{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.panel,.stat,.status,.log{border:1px solid #ccc;padding:5px}
input,select,textarea{width:100%}
input[type=checkbox]{width:auto}
textarea{min-height:150px}
.progress{height:10px;background:#eee;width:100%;margin:5px 0}
.progress>div{height:100%;width:0;background:blue}
.preview{width:100%;aspect-ratio:1;object-fit:contain;border:1px solid #000;background:#fff}
.log{max-height:200px;overflow:auto;white-space:pre-wrap}
.status.ok{color:green}.status.warn{color:orange}.status.bad{color:red}
button.primary{background:#007bff;color:#fff}
button.danger{background:#dc3545;color:#fff}
@media(max-width:900px){.grid,.formgrid,.preview-wrap{grid-template-columns:1fr}}
</style>
<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer/build/mp4-muxer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.3/dist/mp4box.all.min.js"></script>
</head>
<body>
<main>
<h1>QR Video Transfer</h1>
<div class="tabs">
  <button id="tabEncodeBtn" class="primary">埋め込み / 生成</button>
  <button id="tabDecodeBtn">読み取り / 復元</button>
</div>

<section id="encodeTab" class="tab active">
<div class="grid">
  <div class="panel">
    <h2>入力</h2>
    <div class="field">
      <label for="textInput">テキストデータ</label>
      <textarea id="textInput" placeholder="ここに転送したいテキストを入力"></textarea>
    </div>
    <h3>サムネイル</h3>
    <div class="field">
      <input id="thumbInput" type="file" accept="image/*">
    </div>
    <div class="row" style="margin-top:8px">
      <button id="clearThumbBtn">サムネイルを解除</button>
      <span class="help">生成動画の1フレーム目だけに使用。中央を正方形にクロップ。</span>
    </div>
    <div class="preview-wrap">
      <canvas id="thumbPreview" class="preview"></canvas>
      <canvas id="qrPreview" class="preview"></canvas>
    </div>
    <h2 style="margin-top:16px">QR / 動画設定</h2>
    <div class="formgrid">
      <div class="field"><label for="qrVersion">QR Version</label><select id="qrVersion"></select></div>
      <div class="field"><label for="qrEc">誤り訂正</label><select id="qrEc"><option value="L">L</option><option value="M">M</option><option value="Q">Q</option><option value="H" selected>H</option></select></div>
      <div class="field"><label for="modulePx">1 module = px</label><input id="modulePx" type="number" min="1" max="20" step="1" value="4"></div>
      <div class="field"><label for="extraMargin">QR外側余白 px</label><input id="extraMargin" type="number" min="0" max="200" step="1" value="6"></div>
      <div class="field"><label for="fps">FPS (固定CFR)</label><input id="fps" type="number" min="1" max="60" step="1" value="30"></div>
      <div class="field"><label for="bitrate">ビットレート Mbps</label><input id="bitrate" type="number" min="0.5" max="100" step="0.5" value="12"></div>
      <div class="field"><label for="payloadReserve">QR容量の予約 byte</label><input id="payloadReserve" type="number" min="0" max="256" step="1" value="1"></div>
      <div class="field"><label for="mimeType">形式</label><select id="mimeType"><option value="mp4-avc">MP4 (H.264 / AVC)</option></select></div>
    </div>
    <div class="row" style="margin-top:9px">
      <label class="checkbox"><input id="align16" type="checkbox" checked> 出力辺長を16px境界へ切り上げ</label>
      <label class="checkbox"><input id="compressToggle" type="checkbox" checked> DEFLATE圧縮</label>
      <label class="checkbox"><input id="limit100" type="checkbox" checked> データフレームを最大99枚に制限</label>
    </div>
    <div class="row" style="margin-top:13px">
      <button id="generateBtn" class="primary">動画を生成</button>
      <button id="resetSettingsBtn">設定を初期値へ</button>
    </div>
    <div id="encodeStatus" class="status">待機中</div>
    <div class="progress"><div id="encodeProgress"></div></div>
  </div>

  <div class="panel">
    <h2>計算結果</h2>
    <div class="stats" id="encodeStats"></div>
    <h3>生成動画</h3>
    <video id="outputVideo" class="preview" controls playsinline></video>
    <div class="row" style="margin-top:10px">
      <a id="downloadVideo" class="button hidden" download>動画を保存</a>
    </div>
    <pre id="encodeLog" class="log"></pre>
  </div>
</div>
</section>

<section id="decodeTab" class="tab">
<div class="grid">
  <div class="panel">
    <h2>動画入力 (MP4)</h2>
    <div class="field"><label for="videoInput">動画ファイル (.mp4)</label><input id="videoInput" type="file" accept="video/mp4,video/*"></div>
    <div class="row" style="margin-top:10px">
      <button id="decodeBtn" class="primary" disabled>完全分解して復元</button>
      <button id="stopDecodeBtn" class="danger" disabled>停止</button>
    </div>
    <div id="decodeStatus" class="status">動画を選択してください</div>
    <div class="progress"><div id="decodeProgress"></div></div>
    <h3>動画プレビュー</h3>
    <video id="inputVideo" class="preview" controls muted playsinline></video>
  </div>
  <div class="panel">
    <h2>復元結果</h2>
    <div class="stats" id="decodeStats"></div>
    <h3>復元テキスト</h3>
    <textarea id="restoredText" readonly placeholder="復元後のテキストがここに表示されます"></textarea>
    <div class="row" style="margin-top:10px">
      <button id="downloadTextBtn" class="hidden">復元テキストを保存</button>
    </div>
    <pre id="decodeLog" class="log"></pre>
  </div>
</div>
</section>
</main>

<script>
'use strict';

// -------------------------
// Constants / state
// -------------------------
const PROTOCOL_MAGIC = new Uint8Array([0x56,0x51,0x52,0x31]); // VQR1
const PROTOCOL_VERSION = 1;
const HEADER_SIZE = 72;
const MAX_DATA_FRAMES = 99;
const ALIGNMENT = 16;
const SETTINGS_KEY = 'qr-video-transfer-settings-v3';

if (typeof qrcode === 'function') {
  qrcode.stringToBytes = function (s) {
    const out = new Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i) & 0xff;
    return out;
  };
}

const state = {
  thumbBitmap: null,
  thumbURL: null,
  videoURL: null,
  decodeURL: null,
  decodeRunning: false,
  decodeStop: false,
  selectedVideoFile: null,
};

const $ = id => document.getElementById(id);

// -------------------------
// UI helpers
// -------------------------
function setStatus(el, text, kind='') {
  el.textContent = text;
  el.className = 'status' + (kind ? ' ' + kind : '');
}
function setProgress(el, ratio) {
  el.style.width = `${Math.max(0, Math.min(1, ratio))*100}%`;
}
function fmtBytes(n) {
  if (!Number.isFinite(n)) return '-';
  const units = ['B','KiB','MiB','GiB'];
  let x = n, i = 0;
  while (x >= 1024 && i < units.length-1) { x /= 1024; i++; }
  return `${x.toFixed(i ? 2 : 0)} ${units[i]}`;
}
function fmtNum(n) { return Number(n).toLocaleString('ja-JP'); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function setStats(container, obj) {
  container.innerHTML = '';
  for (const [k,v] of Object.entries(obj)) {
    const d = document.createElement('div'); d.className = 'stat';
    const a = document.createElement('div'); a.className = 'k'; a.textContent = k;
    const b = document.createElement('div'); b.className = 'v'; b.textContent = v;
    d.append(a,b); container.appendChild(d);
  }
}
function logTo(el, msg) {
  const t = `[${new Date().toLocaleTimeString()}] ${msg}\n`;
  el.textContent += t;
  el.scrollTop = el.scrollHeight;
}

// -------------------------
// Binary helpers
// -------------------------
function concatBytes(...arrays) {
  const total = arrays.reduce((s,a)=>s+a.length,0);
  const out = new Uint8Array(total);
  let p=0;
  for (const a of arrays) { out.set(a,p); p+=a.length; }
  return out;
}
function u16(n){const b=new Uint8Array(2);new DataView(b.buffer).setUint16(0,n>>>0);return b}
function u32(n){const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,n>>>0);return b}
function r16(a,o){return new DataView(a.buffer,a.byteOffset,a.byteLength).getUint16(o)}
function r32(a,o){return new DataView(a.buffer,a.byteOffset,a.byteLength).getUint32(o)}
function equalBytes(a,b){if(a.length!==b.length)return false;for(let i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true}
function bytesToBinaryString(bytes) {
  let out='';
  const block=8192;
  for(let i=0;i<bytes.length;i+=block){
    const sub=bytes.subarray(i,Math.min(bytes.length,i+block));
    out += String.fromCharCode.apply(null, Array.from(sub));
  }
  return out;
}

// -------------------------
// CRC32 / Hash / Compression
// -------------------------
const CRC_TABLE = (()=>{
  const t=new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c=n;
    for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);
    t[n]=c>>>0;
  }
  return t;
})();
function crc32(bytes){
  let c=0xffffffff;
  for(const b of bytes)c=CRC_TABLE[(c^b)&255]^(c>>>8);
  return (c^0xffffffff)>>>0;
}

async function sha256(bytes){
  const d=await crypto.subtle.digest('SHA-256',bytes);
  return new Uint8Array(d);
}

async function compressBytes(bytes){
  if(!('CompressionStream' in window)) return {bytes, compressed:false};
  const cs=new CompressionStream('deflate');
  const writer=cs.writable.getWriter();
  writer.write(bytes); writer.close();
  const out=await new Response(cs.readable).arrayBuffer();
  const result=new Uint8Array(out);
  return {bytes: result, compressed: result.length < bytes.length};
}
async function decompressBytes(bytes){
  if(!('DecompressionStream' in window)) throw new Error('このブラウザはDEFLATE展開に対応していません。');
  const ds=new DecompressionStream('deflate');
  const writer=ds.writable.getWriter();
  writer.write(bytes); writer.close();
  const out=await new Response(ds.readable).arrayBuffer();
  return new Uint8Array(out);
}

function randomTransferId(){
  const x=new Uint8Array(8); crypto.getRandomValues(x); return x;
}

// -------------------------
// QR helpers
// -------------------------
const capacityCache=new Map();
function buildQR(payloadBytes, version, ec){
  const qr=qrcode(version,ec);
  qr.addData(bytesToBinaryString(payloadBytes),'Byte');
  qr.make();
  return qr;
}
function canEncodeBytes(length,version,ec){
  try{
    const dummy=new Uint8Array(length);
    buildQR(dummy,version,ec);
    return true;
  }catch(e){return false;}
}
function getQRCapacity(version,ec){
  const key=`${version}-${ec}`;
  if(capacityCache.has(key))return capacityCache.get(key);
  let lo=0, hi=3000;
  while(lo<hi){
    const mid=Math.ceil((lo+hi)/2);
    if(canEncodeBytes(mid,version,ec))lo=mid; else hi=mid-1;
  }
  capacityCache.set(key,lo);
  return lo;
}

function drawQRToCanvas(payload, settings, targetCanvas){
  const qr=buildQR(payload,settings.version,settings.ec);
  const modules=qr.getModuleCount();
  const quiet=4*settings.modulePx;
  const rawSize=modules*settings.modulePx + quiet*2 + settings.extraMargin*2;
  const side=settings.align16 ? Math.ceil(rawSize/ALIGNMENT)*ALIGNMENT : rawSize;
  targetCanvas.width=side; targetCanvas.height=side;
  const ctx=targetCanvas.getContext('2d',{alpha:false});
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,side,side);
  const offset=Math.floor((side-(modules*settings.modulePx+quiet*2))/2)+quiet;
  ctx.fillStyle='#000';
  for(let r=0;r<modules;r++){
    for(let c=0;c<modules;c++){
      if(qr.isDark(r,c))ctx.fillRect(offset+c*settings.modulePx,offset+r*settings.modulePx,settings.modulePx,settings.modulePx);
    }
  }
  return {canvas:targetCanvas,modules,side};
}

function currentSettings(){
  return {
    version:+$('qrVersion').value,
    ec:$('qrEc').value,
    modulePx:Math.max(1,+$('modulePx').value||4),
    extraMargin:Math.max(0,+$('extraMargin').value||0),
    fps:Math.max(1,+$('fps').value||30),
    bitrateMbps:Math.max(.5,+$('bitrate').value||12),
    reserve:+$('payloadReserve').value||0,
    align16:$('align16').checked,
    compress:$('compressToggle').checked,
    limit100:$('limit100').checked,
  };
}

let previewTimer=0;
function updateEncodeStats(){
  const s=currentSettings();
  let cap=0, payload=0, side='-';
  try{
    cap=getQRCapacity(s.version,s.ec);
    payload=Math.max(0,cap-HEADER_SIZE-s.reserve);
    const dummy=new Uint8Array(Math.min(payload, Math.max(0,cap-HEADER_SIZE-s.reserve)));
    const qr=buildQR(concatBytes(new Uint8Array(HEADER_SIZE),dummy),s.version,s.ec);
    const modules=qr.getModuleCount();
    const raw=modules*s.modulePx+2*(4*s.modulePx+s.extraMargin);
    side=s.align16?Math.ceil(raw/16)*16:raw;
    if(payload<=0)throw new Error('payload capacity unavailable');
  }catch(e){cap=0;payload=0;}
  const textBytes=new TextEncoder().encode($('textInput').value||'');
  const dataFrames=payload?Math.ceil(textBytes.length/payload):0;
  const frameCount=1+dataFrames;
  setStats($('encodeStats'),{
    '入力サイズ':fmtBytes(textBytes.length),
    'QR容量':cap?`${fmtNum(cap)} B`:'-',
    '実データ/chunk':payload?`${fmtNum(payload)} B`:'-',
    'データフレーム':dataFrames?fmtNum(dataFrames):'0',
    '総フレーム':frameCount?fmtNum(frameCount):'-',
    '動画時間':frameCount?`${(frameCount/s.fps).toFixed(2)} s (固定)`:'-',
    '出力サイズ':side==='-'?'-':`${side} × ${side} px`,
    '設定FPS':`${s.fps} fps (CFR)`,
    '形式':'MP4 (H.264)',
    '圧縮':s.compress?'DEFLATE':'なし',
  });

  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => {
    try{
      const pl = Math.max(1,cap-HEADER_SIZE-s.reserve);
      const dummyPkt = writePacket({transferId:new Uint8Array(8),seq:0,total:1,originalSize:0,encodedSize:pl,flags:0,hash:new Uint8Array(32),payload:new Uint8Array(Math.min(pl,1))});
      drawQRToCanvas(dummyPkt,s,$('qrPreview'));
    }catch{}
  }, 30);

  return {s,cap,payload,textBytes,dataFrames,frameCount,side};
}

// -------------------------
// Protocol packet
// -------------------------
function writePacket({transferId,seq,total,originalSize,encodedSize,flags,hash,payload}){
  if(payload.length>65535)throw new Error('payload too large');
  const h=new Uint8Array(HEADER_SIZE);
  h.set(PROTOCOL_MAGIC,0);
  h[4]=PROTOCOL_VERSION;
  h[5]=flags&255;
  h[6]=HEADER_SIZE;
  h[7]=0;
  h.set(transferId,8);
  h.set(u32(seq),16);
  h.set(u32(total),20);
  h.set(u32(originalSize),24);
  h.set(u32(encodedSize),28);
  h.set(u16(payload.length),32);
  h.set(u16(0),34);
  h.set(hash,36);
  h.set(u32(crc32(payload)),68);
  return concatBytes(h,payload);
}
function parsePacket(bytes){
  if(bytes.length<HEADER_SIZE)return null;
  if(!equalBytes(bytes.subarray(0,4),PROTOCOL_MAGIC))return null;
  if(bytes[4]!==PROTOCOL_VERSION || bytes[6]!==HEADER_SIZE)return null;
  const seq=r32(bytes,16), total=r32(bytes,20), originalSize=r32(bytes,24), encodedSize=r32(bytes,28), len=r16(bytes,32);
  if(total<1 || seq>=total || HEADER_SIZE+len>bytes.length)return null;
  const payload=bytes.slice(HEADER_SIZE,HEADER_SIZE+len);
  const crc=r32(bytes,68);
  if(crc32(payload)!==crc)return null;
  return {
    flags:bytes[5], transferId:bytes.slice(8,16), seq,total,originalSize,encodedSize,payload,
    hash:bytes.slice(36,68),crc
  };
}

// -------------------------
// Thumbnail
// -------------------------
function drawDefaultThumbnail(canvas,side=752){
  canvas.width=side;canvas.height=side;
  const ctx=canvas.getContext('2d');
  const g=ctx.createLinearGradient(0,0,side,side);g.addColorStop(0,'#dbe7f4');g.addColorStop(1,'#8ca5bd');
  ctx.fillStyle=g;ctx.fillRect(0,0,side,side);
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(side*.78,side*.2,side*.22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#12202d';ctx.font=`700 ${Math.max(24,side*.075)}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('DATA VIDEO',side/2,side*.46);
  ctx.font=`500 ${Math.max(14,side*.032)}px system-ui,sans-serif`;ctx.fillText('QR TRANSFER (MP4)',side/2,side*.56);
}
function drawThumbFromImage(canvas,img){
  const side=Math.min(img.width,img.height); 
  const sx=(img.width-side)/2;
  const sy=(img.height-side)/2;
  canvas.width=canvas.height=Math.max(64,Math.round(canvas.width||752));
  const ctx=canvas.getContext('2d');
  ctx.imageSmoothingEnabled=true;
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,sx,sy,side,side,0,0,canvas.width,canvas.height);
}
async function loadThumbnail(file){
  if(state.thumbURL)URL.revokeObjectURL(state.thumbURL);
  state.thumbURL=URL.createObjectURL(file);
  try{
    state.thumbBitmap=await createImageBitmap(file);
    drawThumbFromImage($('thumbPreview'),state.thumbBitmap);
  }catch(e){
    const img=new Image();
    img.onload=()=>{drawThumbFromImage($('thumbPreview'),img);};
    img.src=state.thumbURL;
    state.thumbBitmap=null;
  }
}
function clearThumbnail(){
  if(state.thumbURL)URL.revokeObjectURL(state.thumbURL);
  state.thumbURL=null;
  state.thumbBitmap=null;
  drawDefaultThumbnail($('thumbPreview'),752);
}
function drawThumbnailToCanvas(target,side){
  target.width=target.height=side;
  const ctx=target.getContext('2d');ctx.imageSmoothingEnabled=true;
  if(state.thumbBitmap){
    const img=state.thumbBitmap;
    const crop=Math.min(img.width,img.height);
    const sx=(img.width-crop)/2;
    const sy=(img.height-crop)/2;
    ctx.drawImage(img,sx,sy,crop,crop,0,0,side,side);
  }else{
    drawDefaultThumbnail(target,side);
  }
}

// -------------------------
// Encode (WebCodecs + Mp4Muxer)
// -------------------------
async function generateVideo(){
  const info=updateEncodeStats();
  const {s,cap,payload,textBytes,dataFrames,side}=info;
  if(!textBytes.length){setStatus($('encodeStatus'),'テキストが空です。','warn');return;}
  if(!window.qrcode){setStatus($('encodeStatus'),'QR生成ライブラリの読み込みに失敗しています。','bad');return;}
  if(!('VideoEncoder' in window)){setStatus($('encodeStatus'),'このブラウザはWebCodecs (VideoEncoder) に対応していません。HTTPS環境または最新ブラウザをご利用ください。','bad');return;}
  if(!window.Mp4Muxer){setStatus($('encodeStatus'),'Mp4Muxerライブラリの読み込みに失敗しています。','bad');return;}
  if(dataFrames>MAX_DATA_FRAMES && s.limit100){setStatus($('encodeStatus'),`データが大きすぎます。最大99データフレームです（現在 ${dataFrames}）。`,'bad');return;}
  if(payload<=0){setStatus($('encodeStatus'),'このQR設定ではデータを格納できません。','bad');return;}

  $('generateBtn').disabled=true;$('resetSettingsBtn').disabled=true;
  $('encodeLog').textContent='';setProgress($('encodeProgress'),0);
  setStatus($('encodeStatus'),'データを準備しています…');

  try{
    let encoded=textBytes, compressed=false;
    if(s.compress){
      const c=await compressBytes(textBytes);
      encoded=c.bytes;compressed=c.compressed;
    }
    const finalPayload=compressed?encoded:textBytes;
    const flags=compressed?1:0;
    const total=Math.ceil(finalPayload.length/payload);
    if(total>MAX_DATA_FRAMES && s.limit100)throw new Error(`圧縮後もデータフレームが${MAX_DATA_FRAMES}枚を超えています。`);
    const hash=await sha256(finalPayload);
    const transferId=randomTransferId();
    logTo($('encodeLog'),`入力 ${fmtBytes(textBytes.length)} → payload ${fmtBytes(finalPayload.length)} / 圧縮=${compressed}`);
    logTo($('encodeLog'),`QR capacity=${cap} B, payload/chunk=${payload} B, chunks=${total}`);

    const packets=[];
    for(let i=0;i<total;i++){
      const part=finalPayload.slice(i*payload,Math.min(finalPayload.length,(i+1)*payload));
      packets.push(writePacket({transferId,seq:i,total,originalSize:textBytes.length,encodedSize:finalPayload.length,flags,hash,payload:part}));
    }

    const qrCanvas=document.createElement('canvas');
    let qrInfo=drawQRToCanvas(packets[0],s,qrCanvas);
    let actualSide=qrInfo.side;
    const outputCanvas=document.createElement('canvas');
    outputCanvas.width=outputCanvas.height=actualSide;

    $('qrPreview').width=$('qrPreview').height=actualSide;
    $('qrPreview').getContext('2d').drawImage(qrCanvas,0,0);

    const muxer = new Mp4Muxer.Muxer({
      target: new Mp4Muxer.ArrayBufferTarget(),
      video: {
        codec: 'avc',
        width: actualSide,
        height: actualSide
      },
      fastStart: 'in-memory'
    });

    let encoderError=null;
    const videoEncoder=new VideoEncoder({
      output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),
      error:e=>{encoderError=e;console.error(e);}
    });

    videoEncoder.configure({
      codec: 'avc1.42001f', // Baseline profile Level 3.1 (最大互換性)
      width: actualSide,
      height: actualSide,
      bitrate: Math.round(s.bitrateMbps*1_000_000),
      framerate: s.fps,
      avc: { format: 'avc' }
    });

    const totalFrames=1+total;
    const frameDurationMicros=Math.round(1_000_000/s.fps);

    logTo($('encodeLog'),`MP4エンコード開始 (WebCodecs CFR: ${s.fps} FPS, ${actualSide}x${actualSide})`);

    for(let fi=0;fi<totalFrames;fi++){
      if(encoderError)throw encoderError;

      if(fi===0){
        drawThumbnailToCanvas(outputCanvas,actualSide);
      }else{
        qrInfo=drawQRToCanvas(packets[fi-1],s,qrCanvas);
        const ctx=outputCanvas.getContext('2d');
        ctx.imageSmoothingEnabled=false;
        ctx.drawImage(qrCanvas,0,0,actualSide,actualSide);
      }

      const timestampMicros=fi*frameDurationMicros;
      const frame=new VideoFrame(outputCanvas,{
        timestamp:timestampMicros,
        duration:frameDurationMicros
      });

      const keyFrame=(fi===0 || fi%s.fps===0);
      videoEncoder.encode(frame,{keyFrame});
      frame.close();

      if(fi%5===0 || fi===totalFrames-1){
        setProgress($('encodeProgress'),(fi+1)/totalFrames);
        setStatus($('encodeStatus'),`エンコード中: ${fi+1}/${totalFrames} フレーム`);
        await sleep(0);
      }
    }

    await videoEncoder.flush();
    muxer.finalize();
    const videoBuffer=muxer.target.buffer;
    const blob=new Blob([videoBuffer],{type:'video/mp4'});

    if(state.videoURL)URL.revokeObjectURL(state.videoURL);
    state.videoURL=URL.createObjectURL(blob);
    $('outputVideo').src=state.videoURL;
    $('downloadVideo').href=state.videoURL;
    $('downloadVideo').download=`qr-transfer-${Date.now()}.mp4`;
    $('downloadVideo').classList.remove('hidden');

    setStats($('encodeStats'),{
      '入力サイズ':fmtBytes(textBytes.length),
      '転送payload':fmtBytes(finalPayload.length),
      '圧縮':compressed?`DEFLATE / ${fmtBytes(encoded.length)}`:'なし',
      'QR capacity':`${fmtNum(cap)} B`,
      '実データ/chunk':`${fmtNum(payload)} B`,
      'データフレーム':fmtNum(total),
      '総フレーム':fmtNum(totalFrames),
      '動画時間':`${(totalFrames/s.fps).toFixed(2)} s`,
      '出力サイズ':`${actualSide} × ${actualSide} px`,
      '固定FPS':`${s.fps} fps`,
      '動画ファイル':fmtBytes(blob.size),
    });
    logTo($('encodeLog'),`生成完了: ${fmtBytes(blob.size)} (MP4) / 固定FPS: ${s.fps}`);
    setProgress($('encodeProgress'),1);
    setStatus($('encodeStatus'),'生成完了','ok');
  }catch(e){
    console.error(e);
    setStatus($('encodeStatus'),`生成失敗: ${e.message||e}`,'bad');
    logTo($('encodeLog'),String(e.stack||e));
  }finally{
    $('generateBtn').disabled=false;$('resetSettingsBtn').disabled=false;
  }
}

// -------------------------
// Decode (MP4Box Demux + WebCodecs VideoDecoder + Worker Pool)
// -------------------------
function createWorkerPool(size){
  const workerCode = `
    self.importScripts('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');
    self.onmessage = function(e) {
      const { id, data, width, height } = e.data;
      try {
        const code = jsQR(data, width, height, { inversionAttempts: 'dontInvert' });
        if (code && code.binaryData && code.binaryData.length > 0) {
          const bin = new Uint8Array(code.binaryData);
          self.postMessage({ id, success: true, binaryData: bin }, [bin.buffer]);
        } else {
          self.postMessage({ id, success: false });
        }
      } catch (err) {
        self.postMessage({ id, success: false, error: err.message });
      }
    };
  `;
  const blob = new Blob([workerCode], {type:'application/javascript'});
  const workerUrl = URL.createObjectURL(blob);
  const workers = [];
  for(let i=0;i<size;i++){
    workers.push(new Worker(workerUrl));
  }
  return {
    workers,
    destroy(){
      workers.forEach(w=>w.terminate());
      URL.revokeObjectURL(workerUrl);
    }
  };
}

// MP4Box.DataStream が見つからない環境でも確実にAVCCボックスを取り出すための関数
function getExtradata(mp4boxfile, trackId) {
  const trak = mp4boxfile.getTrackById(trackId);
  if (!trak || !trak.mdia || !trak.mdia.minf || !trak.mdia.minf.stbl || !trak.mdia.minf.stbl.stsd) return null;
  for (const entry of trak.mdia.minf.stbl.stsd.entries) {
    const box = entry.avcC ?? entry.hvcC ?? entry.vpcC;
    if (box != null) {
      // 1. もし window.DataStream が存在する場合はそれを使う（公式推奨）
      if (typeof window.DataStream !== 'undefined') {
        const stream = new window.DataStream(undefined, 0, window.DataStream.BIG_ENDIAN || false);
        box.write(stream);
        return new Uint8Array(stream.buffer.slice(8)); // ボックスヘッダ(8byte)をスキップ
      } 
      // 2. DataStream が無い場合は、VideoDecoderが必要とする AVCDecoderConfigurationRecord を自力でバイナリ構築する
      else if (box.type === 'avcC') {
        let size = 7; // 固定ヘッダサイズ
        if (box.SPS) for(let s of box.SPS) size += 2 + s.length;
        if (box.PPS) for(let p of box.PPS) size += 2 + p.length;
        
        const buf = new Uint8Array(size);
        let i = 0;
        buf[i++] = box.configurationVersion;
        buf[i++] = box.AVCProfileIndication;
        buf[i++] = box.profile_compatibility;
        buf[i++] = box.AVCLevelIndication;
        buf[i++] = 0xFC | (box.lengthSizeMinusOne !== undefined ? box.lengthSizeMinusOne : 3);
        buf[i++] = 0xE0 | (box.nb_SPS_nalus || (box.SPS ? box.SPS.length : 0));
        
        if (box.SPS) {
          for(let s of box.SPS) {
            buf[i++] = (s.length >> 8) & 0xFF;
            buf[i++] = s.length & 0xFF;
            buf.set(s.nalu, i);
            i += s.length;
          }
        }
        
        buf[i++] = box.nb_PPS_nalus || (box.PPS ? box.PPS.length : 0);
        
        if (box.PPS) {
          for(let p of box.PPS) {
            buf[i++] = (p.length >> 8) & 0xFF;
            buf[i++] = p.length & 0xFF;
            buf.set(p.nalu, i);
            i += p.length;
          }
        }
        return buf;
      }
    }
  }
  return null;
}

function computeFrameSignature(data, width, height) {
  let hash = 0;
  const stepX = Math.max(1, Math.floor(width / 32));
  const stepY = Math.max(1, Math.floor(height / 32));
  for (let y = 0; y < height; y += stepY) {
    const rowOffset = y * width * 4;
    for (let x = 0; x < width; x += stepX) {
      const idx = rowOffset + x * 4;
      const val = (data[idx] << 16) | (data[idx + 1] << 8) | data[idx + 2];
      hash = ((hash << 5) - hash + val) | 0;
    }
  }
  return hash;
}

function stopDecode(){
  state.decodeStop=true;
  setStatus($('decodeStatus'),'停止を要求しました…','warn');
}

async function decodeVideo(){
  if(!state.selectedVideoFile)return;
  if(!window.MP4Box){setStatus($('decodeStatus'),'MP4Boxライブラリの読み込みに失敗しています。','bad');return;}
  if(!('VideoDecoder' in window)){setStatus($('decodeStatus'),'このブラウザはWebCodecs (VideoDecoder) に対応していません。','bad');return;}

  state.decodeRunning=true;state.decodeStop=false;
  $('decodeBtn').disabled=true;$('stopDecodeBtn').disabled=false;
  $('restoredText').value='';$('downloadTextBtn').classList.add('hidden');$('decodeLog').textContent='';setProgress($('decodeProgress'),0);
  setStats($('decodeStats'),{});

  const file=state.selectedVideoFile;
  const concurrency = Math.max(2, Math.min(8, navigator.hardwareConcurrency || 4));
  const pool = createWorkerPool(concurrency);

  logTo($('decodeLog'),`ファイル: ${file.name} (${fmtBytes(file.size)}) / WebCodecs完全分解デコード (${concurrency}並列)`);
  setStatus($('decodeStatus'),'MP4ファイルをDemux解析中…');

  const chunks = new Map();
  let transferId=null, total=null, originalSize=null, encodedSize=null, flags=null, expectedHash=null;
  let qrCount=0, duplicateCount=0, invalidCount=0, foreignCount=0;
  let decodedFramesCount = 0;
  let processedFramesCount = 0;
  let isAllChunksCollected = false;

  let inFlight = 0;
  let inFlightResolvers = [];
  function onWorkerFinished(){
    inFlight--;
    if(inFlightResolvers.length > 0){
      const resolve = inFlightResolvers.shift();
      resolve();
    }
  }
  function waitCapacity(){
    if(inFlight < concurrency * 2) return Promise.resolve();
    return new Promise(r => inFlightResolvers.push(r));
  }

  pool.workers.forEach(worker => {
    worker.onmessage = (e) => {
      onWorkerFinished();
      const { success, binaryData } = e.data;
      if (success && binaryData) {
        qrCount++;
        const packet = parsePacket(Uint8Array.from(binaryData));
        if (packet) {
          if (transferId === null) {
            transferId = packet.transferId.slice();
            total = packet.total;
            originalSize = packet.originalSize;
            encodedSize = packet.encodedSize;
            flags = packet.flags;
            expectedHash = packet.hash.slice();
            logTo($('decodeLog'),`プロトコル検出: chunks=${total}, payload=${fmtBytes(encodedSize)}, 圧縮=${!!(flags&1)}`);
          }
          const same = equalBytes(transferId, packet.transferId);
          const compatible = same && packet.total === total && packet.encodedSize === encodedSize && packet.originalSize === originalSize && packet.flags === flags && equalBytes(packet.hash, expectedHash);
          if (compatible) {
            if (chunks.has(packet.seq)) {
              duplicateCount++;
            } else {
              chunks.set(packet.seq, packet.payload.slice());
            }
          } else if (same) {
            invalidCount++;
          } else {
            foreignCount++;
          }
        }
      }

      if (total !== null) {
        setProgress($('decodeProgress'), chunks.size / total);
        setStatus($('decodeStatus'), `解析中… 受信: ${chunks.size}/${total} chunks (QR検出: ${qrCount})`);
        if (chunks.size === total && !isAllChunksCollected) {
          isAllChunksCollected = true;
          logTo($('decodeLog'), 'すべてのチャンクを受信完了。早期終了します。');
        }
      }
    };
  });

  try {
    const arrayBuffer = await file.arrayBuffer();
    arrayBuffer.fileStart = 0;

    const mp4boxfile = MP4Box.createFile();
    const sampleQueue = [];
    let fileInfo = null;

    const mp4ReadyPromise = new Promise((resolve, reject) => {
      mp4boxfile.onReady = (info) => { fileInfo = info; resolve(info); };
      mp4boxfile.onError = (e) => reject(new Error('MP4Boxエラー: ' + e));
    });

    mp4boxfile.onSamples = (trackId, ref, samples) => {
      for (const s of samples) sampleQueue.push(s);
    };

    mp4boxfile.appendBuffer(arrayBuffer);
    mp4boxfile.flush();
    await mp4ReadyPromise;

    const videoTrack = fileInfo.videoTracks[0];
    if (!videoTrack) throw new Error('動画ファイル内に映像トラックが見つかりませんでした。');

    logTo($('decodeLog'),`トラック: ${videoTrack.codec}, ${videoTrack.video.width || videoTrack.track_width}x${videoTrack.video.height || videoTrack.track_height}, 総サンプル数: ${videoTrack.nb_samples}`);

    mp4boxfile.setExtractionOptions(videoTrack.id, 'video', { nbSamples: videoTrack.nb_samples });
    mp4boxfile.start();

    const description = getExtradata(mp4boxfile, videoTrack.id);
    if(!description) throw new Error('動画メタデータからAVCC構成データを抽出できませんでした。');

    let frameCanvas = null;
    let frameCtx = null;
    let lastSignature = null;
    let roundRobinIdx = 0;

    let decoderError = null;
    const decoder = new VideoDecoder({
      output: (videoFrame) => {
        try {
          decodedFramesCount++;
          if (state.decodeStop || isAllChunksCollected) {
            videoFrame.close();
            return;
          }

          if (!frameCanvas) {
            frameCanvas = document.createElement('canvas');
            frameCanvas.width = videoFrame.displayWidth;
            frameCanvas.height = videoFrame.displayHeight;
            frameCtx = frameCanvas.getContext('2d', { willReadFrequently: true });
          }

          frameCtx.drawImage(videoFrame, 0, 0);
          videoFrame.close();

          const imgData = frameCtx.getImageData(0, 0, frameCanvas.width, frameCanvas.height);
          const sig = computeFrameSignature(imgData.data, frameCanvas.width, frameCanvas.height);
          if (sig === lastSignature) {
            return;
          }
          lastSignature = sig;
          processedFramesCount++;

          inFlight++;
          const targetWorker = pool.workers[roundRobinIdx % concurrency];
          roundRobinIdx++;

          const buffer = imgData.data.buffer;
          targetWorker.postMessage({
            id: processedFramesCount,
            data: imgData.data,
            width: frameCanvas.width,
            height: frameCanvas.height
          }, [buffer]);
        } catch (err) {
          console.error(err);
        }
      },
      error: (e) => {
        decoderError = e;
        console.error('VideoDecoder error:', e);
      }
    });

    decoder.configure({
      codec: videoTrack.codec.startsWith('avc1') ? videoTrack.codec : 'avc1.42001f',
      codedWidth: videoTrack.video.width || videoTrack.track_width,
      codedHeight: videoTrack.video.height || videoTrack.track_height,
      description: description
    });

    logTo($('decodeLog'), `VideoDecoder初期化完了。全${sampleQueue.length}フレームのデコードを開始`);

    for (let i = 0; i < sampleQueue.length; i++) {
      if (state.decodeStop || isAllChunksCollected) break;
      if (decoderError) throw decoderError;

      await waitCapacity();

      const sample = sampleQueue[i];
      const chunk = new EncodedVideoChunk({
        type: sample.is_sync ? 'key' : 'delta',
        timestamp: sample.cts,
        duration: sample.duration,
        data: sample.data
      });

      decoder.decode(chunk);

      if (i % 15 === 0 && total === null) {
        setProgress($('decodeProgress'), (i + 1) / sampleQueue.length * 0.5);
        setStatus($('decodeStatus'), `フレーム解凍中… ${i + 1}/${sampleQueue.length}`);
        await sleep(0);
      }
    }

    if (!state.decodeStop && !isAllChunksCollected) {
      await decoder.flush();
    }

    while (inFlight > 0) {
      if (isAllChunksCollected) break;
      await sleep(20);
    }

    if (total !== null && chunks.size === total) {
      const joined = new Uint8Array(encodedSize);
      let p = 0;
      for (let i = 0; i < total; i++) {
        const c = chunks.get(i);
        if (!c) throw new Error(`chunk ${i} が欠落しています。`);
        joined.set(c, p); p += c.length;
      }
      const h = await sha256(joined);
      if (!equalBytes(h, expectedHash)) throw new Error('SHA-256検証失敗。動画データが破損しています。');

      let plain = joined;
      const compressed = !!(flags & 1);
      if (compressed) plain = await decompressBytes(joined);
      if (originalSize !== null && plain.length !== originalSize) throw new Error(`復元サイズ不一致: expected ${originalSize}, got ${plain.length}`);

      const text = new TextDecoder('utf-8', { fatal: true }).decode(plain);
      $('restoredText').value = text;
      const outBlob = new Blob([plain], { type: 'text/plain;charset=utf-8' });
      $('downloadTextBtn').onclick = () => {
        const u = URL.createObjectURL(outBlob); const a = document.createElement('a'); a.href = u; a.download = `restored-${Date.now()}.txt`; a.click(); setTimeout(() => URL.revokeObjectURL(u), 1000);
      };
      $('downloadTextBtn').classList.remove('hidden');

      setStats($('decodeStats'), {
        '状態': 'VALID (完全復元)',
        '総サンプル数': fmtNum(sampleQueue.length),
        '解凍フレーム': fmtNum(decodedFramesCount),
        '解析フレーム': fmtNum(processedFramesCount),
        'QR検出数': fmtNum(qrCount),
        'chunk': `${fmtNum(chunks.size)} / ${fmtNum(total)}`,
        '重複検出': fmtNum(duplicateCount),
        '圧縮': compressed ? 'DEFLATE' : 'なし',
        '復元サイズ': fmtBytes(plain.length),
        'SHA-256': 'PASS (一致)',
      });
      setProgress($('decodeProgress'), 1);
      setStatus($('decodeStatus'), '復元完了。全チャンクの整合性を確認しました。', 'ok');
      logTo($('decodeLog'), `復元成功: ${fmtBytes(plain.length)} (解凍フレーム: ${decodedFramesCount})`);
    } else {
      const missing = [];
      if (total !== null) { for (let i = 0; i < total; i++) if (!chunks.has(i)) missing.push(i); }
      setStats($('decodeStats'), {
        '状態': 'INCOMPLETE',
        '解凍フレーム': fmtNum(decodedFramesCount),
        '解析フレーム': fmtNum(processedFramesCount),
        'QR検出数': fmtNum(qrCount),
        'chunk': total !== null ? `${fmtNum(chunks.size)} / ${fmtNum(total)}` : '未確定',
        '欠落chunk': missing.length ? (missing.slice(0, 30).join(',') + (missing.length > 30 ? ' …' : '')) : 'プロトコル未検出',
      });
      setStatus($('decodeStatus'), '読み取り終了。必要なチャンクが不足しています。', 'warn');
    }
  } catch (e) {
    console.error(e);
    setStatus($('decodeStatus'), `エラー: ${e.message || e}`, 'bad');
    logTo($('decodeLog'), String(e.stack || e));
  } finally {
    pool.destroy();
    state.decodeRunning = false;
    $('decodeBtn').disabled = false;
    $('stopDecodeBtn').disabled = true;
  }
}

// -------------------------
// Settings / init
// -------------------------
function populateVersions(){
  const s=$('qrVersion');
  for(let i=1;i<=40;i++){const o=document.createElement('option');o.value=i;o.textContent=`Version ${i} (${17+4*i}×${17+4*i})`;if(i===40)o.selected=true;s.appendChild(o)}
}
function saveSettings(){
  const ids=['qrVersion','qrEc','modulePx','extraMargin','fps','bitrate','payloadReserve','align16','compressToggle','limit100'];
  const d={};for(const id of ids){const el=$(id);d[id]=el.type==='checkbox'?el.checked:el.value}
  localStorage.setItem(SETTINGS_KEY,JSON.stringify(d));
}
function loadSettings(){
  try{
    const d=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'null');if(!d)return;
    for(const [id,v] of Object.entries(d)){const el=$(id);if(!el)continue;if(el.type==='checkbox')el.checked=!!v;else el.value=v;}
  }catch{}
}
function resetSettings(){
  $('qrVersion').value='40';$('qrEc').value='H';$('modulePx').value='4';$('extraMargin').value='6';$('fps').value='30';$('bitrate').value='12';$('payloadReserve').value='1';$('align16').checked=true;$('compressToggle').checked=true;$('limit100').checked=true;
  saveSettings();updateEncodeStats();
}
function bindEvents(){
  $('tabEncodeBtn').onclick=()=>{$('encodeTab').classList.add('active');$('decodeTab').classList.remove('active');$('tabEncodeBtn').classList.add('primary');$('tabDecodeBtn').classList.remove('primary')};
  $('tabDecodeBtn').onclick=()=>{$('decodeTab').classList.add('active');$('encodeTab').classList.remove('active');$('tabDecodeBtn').classList.add('primary');$('tabEncodeBtn').classList.remove('primary')};
  $('thumbInput').onchange=()=>{const f=$('thumbInput').files[0];if(f)loadThumbnail(f)};
  $('clearThumbBtn').onclick=()=>{clearThumbnail();$('thumbInput').value=''};
  ['textInput','qrVersion','qrEc','modulePx','extraMargin','fps','bitrate','payloadReserve','align16','compressToggle','limit100'].forEach(id=>$(id).addEventListener('input',()=>{saveSettings();updateEncodeStats()}));
  $('qrVersion').addEventListener('change',updateEncodeStats);$('qrEc').addEventListener('change',updateEncodeStats);
  $('generateBtn').onclick=generateVideo;$('resetSettingsBtn').onclick=resetSettings;
  $('videoInput').onchange=()=>{
    state.selectedVideoFile=$('videoInput').files[0]||null;
    $('decodeBtn').disabled=!state.selectedVideoFile;
    if(state.selectedVideoFile){
      if(state.decodeURL)URL.revokeObjectURL(state.decodeURL);
      state.decodeURL=URL.createObjectURL(state.selectedVideoFile);
      $('inputVideo').src=state.decodeURL;$('inputVideo').load();
      setStatus($('decodeStatus'),`${state.selectedVideoFile.name} / ${fmtBytes(state.selectedVideoFile.size)}`);
    }
  };
  $('decodeBtn').onclick=decodeVideo;$('stopDecodeBtn').onclick=stopDecode;
}

(function init(){
  populateVersions();
  loadSettings();
  bindEvents();
  clearThumbnail();
  updateEncodeStats();

  setTimeout(()=>{
    if(typeof qrcode!=='function')setStatus($('encodeStatus'),'qrcode-generatorを読み込めませんでした。ネットワーク接続を確認してください。','bad');
    if(typeof jsQR!=='function')setStatus($('decodeStatus'),'jsQRを読み込めませんでした。ネットワーク接続を確認してください。','bad');
    if(typeof MP4Box==='undefined')setStatus($('decodeStatus'),'MP4Boxを読み込めませんでした。ネットワーク接続を確認してください。','bad');
  }, 500);
})();
